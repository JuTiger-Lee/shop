<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크레이지 아케이드</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f2a; color: #e8ecf5;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { background: #cfe8f7; border: 4px solid #0b0e15; border-radius: 6px; max-width: 96vw; height: auto; }
  p { margin: 0; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<canvas id="game" width="624" height="528"></canvas>
<p>← → 이동 &nbsp;|&nbsp; Space 물풍선 &nbsp;|&nbsp; R 재시작 &nbsp;|&nbsp; AI 봇을 물줄기로 쓰러뜨리세요</p>

<script>
// ===== 설정 =====
const T = 48, COLS = 13, ROWS = 11;
const ROW = 9;                       // 캐릭터가 서 있는 줄
const HALF = 14;                     // 충돌 박스 반너비
const FUSE = 2.0, RANGE = 2, BLAST_TIME = 0.5;
const STEP = 1 / 60;

// ===== SVG 에셋 =====
function svgImg(svg) {
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return img;
}

const PALETTES = {
  player: { main: '#2f7de1', dark: '#1b4c97', accent: '#ffd23f', hat: 'cap' },
  bot:    { main: '#e8483b', dark: '#a02a21', accent: '#3ddc97', hat: 'helmet' },
};

// 오리지널 치비 캐릭터 (오른쪽을 바라보는 기준, 왼쪽은 캔버스 반전)
function characterSVG(p, frame, dead) {
  const lift = frame === 1 ? -3 : 0, lift2 = frame === 2 ? -3 : 0;
  const swing = frame === 1 ? 22 : frame === 2 ? -22 : 0;
  const ink = '#2b2b3a';
  const hat = p.hat === 'cap'
    ? `<path d="M14 25 Q13 5 32 5.5 Q51 5 50 25 Q32 17 14 25Z" fill="${p.main}" stroke="${ink}" stroke-width="1.6"/>
       <path d="M30 21 Q47 16 57 25 Q45 28 30 25Z" fill="${p.accent}" stroke="${ink}" stroke-width="1.6"/>
       <circle cx="22" cy="12" r="4.2" fill="#bfe8ff" stroke="${ink}" stroke-width="1.4"/>
       <circle cx="33" cy="10" r="4.2" fill="#bfe8ff" stroke="${ink}" stroke-width="1.4"/>
       <circle cx="32" cy="6.5" r="2" fill="${p.accent}" stroke="${ink}" stroke-width="1"/>`
    : `<path d="M13 27 Q12 9 32 8 Q52 9 51 27 Q32 20 13 27Z" fill="${p.main}" stroke="${ink}" stroke-width="1.6"/>
       <path d="M16 20 Q32 12 48 20 L49 24 Q32 17 15 24Z" fill="${p.accent}" stroke="${ink}" stroke-width="1.2"/>
       <line x1="32" y1="8.5" x2="32" y2="3" stroke="${ink}" stroke-width="1.6"/>
       <circle cx="32" cy="3" r="2.8" fill="${p.accent}" stroke="${ink}" stroke-width="1.2"/>`;
  const eyes = dead
    ? `<g stroke="${ink}" stroke-width="2.2" stroke-linecap="round">
         <line x1="24" y1="26" x2="31" y2="33"/><line x1="31" y1="26" x2="24" y2="33"/>
         <line x1="36" y1="26" x2="43" y2="33"/><line x1="43" y1="26" x2="36" y2="33"/></g>
       <path d="M28 39 Q33 35 38 39" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="28" cy="30" rx="3.2" ry="4.4" fill="#1d1d2b"/>
       <ellipse cx="40" cy="30" rx="3.2" ry="4.4" fill="#1d1d2b"/>
       <circle cx="29" cy="28.3" r="1.3" fill="#fff"/><circle cx="41" cy="28.3" r="1.3" fill="#fff"/>
       <path d="M31 36 Q34 40 38 36" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const bubble = dead
    ? `<circle cx="32" cy="34" r="29" fill="rgba(120,195,255,.35)" stroke="#5aaef5" stroke-width="2.5"/>
       <ellipse cx="18" cy="18" rx="5" ry="3" transform="rotate(-35 18 18)" fill="rgba(255,255,255,.7)"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="skin" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffe6cc"/><stop offset="1" stop-color="#f3b98a"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.main}"/><stop offset="1" stop-color="${p.dark}"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="60" rx="16" ry="3.5" fill="rgba(0,0,0,.25)"/>
  <g transform="translate(0 ${lift})"><rect x="23" y="48" width="8" height="9" rx="3" fill="#f2f2f7" stroke="${ink}" stroke-width="1.5"/>
    <ellipse cx="27.5" cy="57" rx="6" ry="3" fill="${p.accent}" stroke="${ink}" stroke-width="1.5"/></g>
  <g transform="translate(0 ${lift2})"><rect x="34" y="48" width="8" height="9" rx="3" fill="#f2f2f7" stroke="${ink}" stroke-width="1.5"/>
    <ellipse cx="38.5" cy="57" rx="6" ry="3" fill="${p.accent}" stroke="${ink}" stroke-width="1.5"/></g>
  <g transform="rotate(${swing} 21 40)"><rect x="14" y="38" width="8" height="12" rx="4" fill="${p.main}" stroke="${ink}" stroke-width="1.5"/>
    <circle cx="18" cy="51" r="3.6" fill="url(#skin)" stroke="${ink}" stroke-width="1.3"/></g>
  <rect x="21" y="36" width="22" height="17" rx="7" fill="url(#body)" stroke="${ink}" stroke-width="1.6"/>
  <rect x="21" y="45" width="22" height="4" fill="${p.accent}" stroke="${ink}" stroke-width="1"/>
  <circle cx="32" cy="47" r="2.6" fill="#fff" stroke="${ink}" stroke-width="1"/>
  <g transform="rotate(${-swing} 43 40)"><rect x="42" y="38" width="8" height="12" rx="4" fill="${p.main}" stroke="${ink}" stroke-width="1.5"/>
    <circle cx="46" cy="51" r="3.6" fill="url(#skin)" stroke="${ink}" stroke-width="1.3"/></g>
  <circle cx="32" cy="26" r="18" fill="url(#skin)" stroke="${ink}" stroke-width="1.6"/>
  ${hat}
  <ellipse cx="22" cy="35" rx="3.6" ry="2.2" fill="#ff8fa3" opacity=".6"/>
  <ellipse cx="45" cy="35" rx="3.6" ry="2.2" fill="#ff8fa3" opacity=".6"/>
  ${eyes}
  ${bubble}
</svg>`;
}

const floorSVG = (a, b) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" fill="${a}"/><rect x="2" y="2" width="44" height="44" rx="6" fill="${b}"/>
  <path d="M6 8 Q14 5 22 6" stroke="#fff" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/></svg>`;

const wallSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8aa3"/><stop offset="1" stop-color="#434c60"/></linearGradient></defs>
  <rect width="48" height="48" fill="#2f3646"/>
  <rect x="2" y="2" width="44" height="44" rx="5" fill="url(#w)" stroke="#262c3a" stroke-width="2"/>
  <path d="M3 24 H45 M16 3 V24 M32 24 V45" stroke="#2f3646" stroke-width="2" opacity=".6"/>
  <path d="M6 7 H40" stroke="#c4cde0" stroke-width="2" opacity=".5" stroke-linecap="round"/>
  <circle cx="8" cy="40" r="1.8" fill="#262c3a"/><circle cx="40" cy="40" r="1.8" fill="#262c3a"/></svg>`;

const crateSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a45e"/><stop offset="1" stop-color="#b3733a"/></linearGradient></defs>
  <rect x="2" y="2" width="44" height="44" rx="4" fill="url(#c)" stroke="#6b3f1a" stroke-width="2.5"/>
  <rect x="7" y="7" width="34" height="34" rx="2" fill="none" stroke="#7a4a21" stroke-width="2"/>
  <path d="M8 8 L40 40 M40 8 L8 40" stroke="#7a4a21" stroke-width="2.5"/>
  <path d="M10 14 H18 M30 34 H38" stroke="#f1c791" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <circle cx="8" cy="8" r="1.8" fill="#4d2a0f"/><circle cx="40" cy="8" r="1.8" fill="#4d2a0f"/>
  <circle cx="8" cy="40" r="1.8" fill="#4d2a0f"/><circle cx="40" cy="40" r="1.8" fill="#4d2a0f"/></svg>`;

const balloonSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs><radialGradient id="b" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#d6f0ff"/><stop offset=".45" stop-color="#4fb0ff"/><stop offset="1" stop-color="#1c5fd1"/></radialGradient></defs>
  <ellipse cx="24" cy="45" rx="13" ry="2.5" fill="rgba(0,0,0,.22)"/>
  <polygon points="19.5,38 28.5,38 24,45" fill="#1a52b8" stroke="#103a85" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M24 5 C36 5 42 15 40 25 C38 35 30 40 24 40 C18 40 10 35 8 25 C6 15 12 5 24 5Z" fill="url(#b)" stroke="#103a85" stroke-width="2"/>
  <ellipse cx="16" cy="14" rx="5" ry="3" transform="rotate(-35 16 14)" fill="#fff" opacity=".75"/>
  <circle cx="19" cy="25" r="2" fill="#0d2d6b"/><circle cx="29" cy="25" r="2" fill="#0d2d6b"/>
  <path d="M21 30 Q24 33 27 30" stroke="#0d2d6b" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;

const splashCenterSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs><radialGradient id="s" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#8fd0ff"/><stop offset="1" stop-color="#2b86f0"/></radialGradient></defs>
  <circle cx="24" cy="24" r="22" fill="url(#s)" stroke="#1d63c4" stroke-width="2"/>
  <circle cx="24" cy="24" r="12" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
  <circle cx="10" cy="10" r="3" fill="#bfe6ff"/><circle cx="39" cy="12" r="2.5" fill="#bfe6ff"/>
  <circle cx="38" cy="39" r="3" fill="#bfe6ff"/><circle cx="9" cy="38" r="2.2" fill="#bfe6ff"/></svg>`;

const splashArmSVG = (tip) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6dcff"/><stop offset=".5" stop-color="#4aa6fb"/><stop offset="1" stop-color="#2275e0"/></linearGradient></defs>
  <path d="${tip ? 'M0 9 H30 A15 15 0 0 1 30 39 H0 Z' : 'M0 9 H48 V39 H0 Z'}" fill="url(#a)" stroke="#1d63c4" stroke-width="2"/>
  <path d="M0 16 Q12 11 24 16 T48 16" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>
  <circle cx="14" cy="28" r="3" fill="#fff" opacity=".6"/><circle cx="30" cy="31" r="2" fill="#fff" opacity=".6"/>
  <circle cx="38" cy="24" r="2.4" fill="#fff" opacity=".5"/></svg>`;

const IMG = {
  floorA: svgImg(floorSVG('#bfe0f4', '#d3ecfa')),
  floorB: svgImg(floorSVG('#b4d8ee', '#c9e6f6')),
  wall: svgImg(wallSVG),
  crate: svgImg(crateSVG),
  balloon: svgImg(balloonSVG),
  center: svgImg(splashCenterSVG),
  arm: svgImg(splashArmSVG(false)),
  tip: svgImg(splashArmSVG(true)),
};
for (const k of Object.keys(PALETTES)) {
  IMG[k] = [0, 1, 2].map(f => svgImg(characterSVG(PALETTES[k], f, false)));
  IMG[k + 'Dead'] = svgImg(characterSVG(PALETTES[k], 0, true));
}

// ===== 맵 (0: 빈칸, 1: 고정 벽, 2: 파괴 가능 블록) =====
function createMap() {
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g.push([]);
    for (let c = 0; c < COLS; c++) {
      let v = 0;
      if (r === 0 || c === 0 || r === ROWS - 1 || c === COLS - 1) v = 1;
      else if (r % 2 === 0 && c % 2 === 0) v = 1;
      else if ((r === 7 || r === 8) && c % 2 === 1) v = 2;
      g[r].push(v);
    }
  }
  return g;
}

// ===== 상태 =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let grid, player, bot, entities, bombs, blasts, state, time;
const keys = { left: false, right: false };

function makeEntity(kind, col, dir, speed) {
  return { kind, x: col * T + T / 2, dir, speed, alive: true, moving: false,
           cool: 0, wish: 0, thinkT: 0.5 };
}

function reset() {
  grid = createMap();
  player = makeEntity('player', 2, 1, 180);
  bot = makeEntity('bot', 10, -1, 150);
  entities = [player, bot];
  bombs = [];
  blasts = [];
  state = 'ready'; // ready | playing | gameover | clear | draw
  time = 0;
}

// ===== 입력 =====
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
  else if (e.code === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  else if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'ready') state = 'playing';
    else if (state === 'playing') placeBomb(player);
  } else if (e.code === 'KeyR') reset();
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  else if (e.code === 'ArrowRight') keys.right = false;
});

// ===== 공통 로직 =====
const colOf = (e) => Math.floor(e.x / T);
const hasBomb = (e) => bombs.some(b => b.owner === e);
const bombAt = (c) => bombs.find(b => b.col === c);
const overlapsTile = (e, c) => Math.abs(e.x - (c * T + T / 2)) < T / 2 + HALF;
const otherOf = (e) => (e === player ? bot : player);

function isSolidFor(e, c) {
  if (grid[ROW][c] !== 0) return true;
  return bombs.some(b => b.col === c && !b.pass.includes(e));
}

function occupiedByOther(e, c) {
  const o = otherOf(e);
  return o.alive && colOf(o) === c;
}

function moveEntity(e, d, dt) {
  e.moving = d !== 0;
  if (d === 0) return;
  e.dir = d;
  let nx = e.x + d * e.speed * dt;
  if (d > 0) {
    const c = Math.floor((nx + HALF) / T);
    if (isSolidFor(e, c)) nx = c * T - HALF - 0.01;
  } else {
    const c = Math.floor((nx - HALF) / T);
    if (isSolidFor(e, c)) nx = (c + 1) * T + HALF + 0.01;
  }
  const o = otherOf(e);
  if (o.alive) {
    if (e.x < o.x) nx = Math.min(nx, o.x - 2 * HALF);
    else nx = Math.max(nx, o.x + 2 * HALF);
  }
  e.x = nx;
}

function placeBomb(e) {
  if (!e.alive || hasBomb(e) || bombAt(colOf(e))) return;
  const col = colOf(e);
  bombs.push({ owner: e, col, timer: FUSE, pass: entities.filter(en => en.alive && overlapsTile(en, col)) });
}

function explode(b) {
  bombs.splice(bombs.indexOf(b), 1);
  const cells = [{ r: ROW, c: b.col, type: 'center', rot: 0 }];
  const dirs = [[0, 1, 0], [1, 0, 90], [0, -1, 180], [-1, 0, 270]];
  for (const [dr, dc, rot] of dirs) {
    let last = null;
    for (let i = 1; i <= RANGE; i++) {
      const r = ROW + dr * i, c = b.col + dc * i;
      const v = grid[r][c];
      if (v === 1) break;
      last = { r, c, type: 'arm', rot };
      cells.push(last);
      if (v === 2) { grid[r][c] = 0; last.type = 'tip'; break; }
    }
    if (last) last.type = 'tip';
  }
  blasts.push({ cells, timer: BLAST_TIME });
  b.owner.cool = 1.2;
  for (const ob of bombs) {                       // 연쇄 폭발
    if (cells.some(cl => cl.r === ROW && cl.c === ob.col)) ob.timer = 0;
  }
}

// ===== AI 봇 =====
function dangerous(c) {
  return bombs.some(b => Math.abs(b.col - c) <= RANGE) ||
         blasts.some(bl => bl.cells.some(x => x.r === ROW && x.c === c));
}

function fleeDir(e) {
  const col = colOf(e), away = Math.sign(e.x - otherOf(e).x) || 1;
  let best = 0, bestK = 99;
  for (const d of [-1, 1]) {
    for (let k = 1; k <= 6; k++) {
      const c = col + d * k;
      if (c < 1 || c > COLS - 2 || isSolidFor(e, c) || occupiedByOther(e, c)) break;
      if (!dangerous(c)) {
        if (k < bestK || (k === bestK && d === away)) { bestK = k; best = d; }
        break;
      }
    }
  }
  return best || away;
}

function hasEscapeRoom(e, col) {
  for (const d of [-1, 1]) {
    let ok = true;
    for (let k = 1; k <= 3; k++) {
      const c = col + d * k;
      if (c < 1 || c > COLS - 2 || grid[ROW][c] !== 0 || bombAt(c) || occupiedByOther(e, c)) { ok = false; break; }
    }
    if (ok && !dangerous(col + d * 3)) return true;
  }
  return false;
}

function aiThink(e) {
  const opp = otherOf(e), col = colOf(e);
  const dist = Math.abs(colOf(opp) - col);
  const toward = Math.sign(opp.x - e.x) || 1;
  if (dangerous(col)) { e.wish = fleeDir(e); return; }

  if (opp.alive && !hasBomb(e) && e.cool <= 0 && dist <= RANGE && hasEscapeRoom(e, col)) {
    placeBomb(e);
    e.wish = fleeDir(e);
    return;
  }
  let w = 0;
  if (!opp.alive) w = 0;
  else if (dist > 3) w = toward;
  else if (dist === 3) w = Math.random() < 0.35 ? toward : 0;
  else if (hasBomb(e) || e.cool > 0) w = -toward;
  if (w !== 0 && (dangerous(col + w) || isSolidFor(e, col + w))) w = 0;
  e.wish = w;
}

// ===== 업데이트 =====
function update(dt) {
  time += dt;
  if (state === 'ready') return;
  const live = state === 'playing';

  if (live) {
    moveEntity(player, (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dt);
    if (bot.alive) {
      bot.thinkT -= dt;
      if (bot.thinkT <= 0) { bot.thinkT = 0.1 + Math.random() * 0.12; aiThink(bot); }
      moveEntity(bot, bot.wish, dt);
    }
    for (const e of entities) e.cool = Math.max(0, e.cool - dt);
  }

  for (const b of bombs) {
    b.pass = b.pass.filter(en => en.alive && overlapsTile(en, b.col));
    b.timer -= dt;
  }
  let b;
  while ((b = bombs.find(x => x.timer <= 0))) explode(b);

  for (const bl of blasts) {
    for (const e of entities) {
      if (e.alive && bl.cells.some(cl => cl.r === ROW && cl.c === colOf(e))) e.alive = false;
    }
    bl.timer -= dt;
  }
  blasts = blasts.filter(bl => bl.timer > 0);

  if (live) {
    if (!player.alive) state = bot.alive ? 'gameover' : 'draw';
    else if (!bot.alive) state = 'clear';
  }
}

// ===== 렌더 =====
function drawImg(img, x, y, w, h) {
  if (img.complete && img.naturalWidth !== 0) ctx.drawImage(img, x, y, w, h);
}

function drawEntity(e) {
  const dead = !e.alive;
  const frame = e.moving && e.alive ? 1 + (Math.floor(time * 10) % 2) : 0;
  const img = dead ? IMG[e.kind + 'Dead'] : IMG[e.kind][frame];
  const y = ROW * T - 16 + (dead ? Math.sin(time * 3) * 3 - 4 : 0);
  ctx.save();
  ctx.translate(e.x, 0);
  if (e.dir < 0) ctx.scale(-1, 1);
  drawImg(img, -32, y, 64, 64);
  ctx.restore();
  ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = e.kind === 'player' ? '#1b4c97' : '#a02a21';
  ctx.fillText(e.kind === 'player' ? 'YOU' : 'BOT', e.x, y + 1);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * T, y = r * T, v = grid[r][c];
      drawImg(v === 1 ? IMG.wall : (r + c) % 2 ? IMG.floorA : IMG.floorB, x, y, T, T);
      if (v === 2) drawImg(IMG.crate, x, y, T, T);
    }
  }

  for (const bl of blasts) {
    ctx.globalAlpha = Math.min(1, bl.timer / 0.15);
    for (const cl of bl.cells) {
      const cx = cl.c * T + T / 2, cy = cl.r * T + T / 2;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(cl.rot * Math.PI / 180);
      drawImg(IMG[cl.type], -T / 2, -T / 2, T, T);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  for (const b of bombs) {
    const speed = 8 + (FUSE - b.timer) * 6;
    const s = 1 + 0.09 * Math.sin(time * speed);
    const cx = b.col * T + T / 2, cy = ROW * T + T / 2;
    ctx.save(); ctx.translate(cx, cy + 2); ctx.scale(s, s);
    drawImg(IMG.balloon, -T / 2, -T / 2, T, T);
    ctx.restore();
  }

  // 죽은 캐릭터를 먼저, 살아있는 캐릭터를 위에
  [...entities].sort((a, b) => (b.alive ? 0 : 1) - (a.alive ? 0 : 1)).forEach(drawEntity);

  const msg = { ready: ['크레이지 아케이드', 'Space 를 눌러 시작  ·  AI 봇과 대결!'],
                gameover: ['GAME OVER', 'R 키로 재시작'],
                clear: ['YOU WIN!', 'R 키로 다시 하기'],
                draw: ['DRAW', 'R 키로 다시 하기'] }[state];
  if (msg) {
    ctx.fillStyle = 'rgba(10,14,24,0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 44px sans-serif'; ctx.fillText(msg[0], canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '20px sans-serif'; ctx.fillText(msg[1], canvas.width / 2, canvas.height / 2 + 30);
  }
}

// ===== 게임 루프 (고정 타임스텝) =====
let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min((ts - last) / 1000, 0.1);
  last = ts;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
</script>
